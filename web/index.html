<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony La Russa Baseball II</title>
<link rel="stylesheet" href="js-dos.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #dos { width: 100%; height: 100%; }
  #status { position: fixed; right: 8px; bottom: 6px; font: 12px monospace; color: #9a9; pointer-events: none; }
  #saves-toggle, #studio-toggle { font: 12px monospace; background: #111e; color: #ddd; border: 1px solid #444; padding: 3px 8px; cursor: pointer; }
  .panel { margin-top: 4px; width: 300px; max-height: 80vh; overflow: auto; box-sizing: border-box; padding: 8px;
           font: 12px monospace; background: #111e; color: #ddd; border: 1px solid #444; }
  #saves-top { position: fixed; top: 8px; right: 8px; z-index: 10000; }
  #saves-bar { display: flex; justify-content: flex-end; gap: 4px; }
  .panel [hidden] { display: none !important; }
  #saves-top [hidden] { display: none !important; }
  .panel button { font: 12px monospace; background: #222; color: #ddd; border: 1px solid #444; padding: 2px 6px; margin: 2px 0; cursor: pointer; }
  .panel input[type=text] { font: 12px monospace; background: #000; color: #ddd; border: 1px solid #444; width: 100%; box-sizing: border-box; padding: 2px 4px; margin: 2px 0; }
  .panel input[type=file] { font: 12px monospace; color: #ddd; max-width: 100%; margin: 2px 0; }
  .panel textarea { font: 12px monospace; background: #000; color: #ddd; border: 1px solid #444; width: 100%; box-sizing: border-box; padding: 2px 4px; margin: 2px 0; resize: vertical; }
  .panel select { font: 12px monospace; background: #000; color: #ddd; border: 1px solid #444; }
  .panel .sec { margin-top: 8px; padding-top: 6px; border-top: 1px solid #333; }
  .panel ul { list-style: none; margin: 4px 0; padding: 0; }
  .panel li { border-top: 1px solid #333; padding: 4px 0; }
  .panel .muted { color: #888; }
  #saves-err, #studio-err { color: #e88; min-height: 1em; }
  #saves-msg, #studio-status { color: #9c9; min-height: 1em; }
  .panel details { margin-left: 8px; }
  .panel details li { border-top: 1px dotted #333; }
  #studio-previews { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .studio-cell img { display: block; width: 96px; height: 112px; image-rendering: pixelated; background: #000; border: 1px solid #333; }
</style>
</head>
<body>
<div id="dos"></div>
<div id="status"></div>
<div id="saves-top">
  <div id="saves-bar">
    <button id="studio-toggle" type="button">STUDIO</button>
    <button id="saves-toggle" type="button">SAVES</button>
  </div>
  <div id="saves-panel" class="panel" hidden>
    <div><b id="saves-slot"></b></div>
    <div class="muted" id="saves-last"></div>
    <div class="sec">
      <button id="saves-now" type="button">Save now</button>
      <div id="saves-msg"></div>
      <div id="saves-err"></div>
      <button id="saves-force" type="button" hidden></button>
    </div>
    <div class="sec">
      <div class="muted">Save as (copies the current slot)</div>
      <input type="text" id="saves-as" maxlength="64" autocomplete="off" spellcheck="false">
      <button id="saves-as-go" type="button">Save as</button>
    </div>
    <div class="sec">
      <div class="muted">Slots</div>
      <ul id="saves-list"></ul>
    </div>
    <div class="sec">
      <div class="muted">New league (starts from the clean bundle)</div>
      <input type="text" id="saves-league" maxlength="64" autocomplete="off" spellcheck="false">
      <button id="saves-league-go" type="button">New league</button>
    </div>
    <div class="sec">
      <label><input type="checkbox" id="saves-auto"> Autosave every</label>
      <select id="saves-every">
        <option value="2">2 min</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
      </select>
    </div>
  </div>
  <div id="studio-panel" class="panel" hidden>
    <div><b>portrait studio</b></div>
    <div class="sec">
      <div class="muted">Describe a face (300 characters, plain ASCII) and/or pick a picture (PNG or JPEG, 4 MB max)</div>
      <textarea id="studio-prompt" maxlength="300" rows="3" spellcheck="false"></textarea>
      <input type="file" id="studio-file" accept="image/png,image/jpeg">
      <button id="studio-go" type="button">GENERATE</button>
    </div>
    <div class="sec">
      <div id="studio-status"></div>
      <div id="studio-err"></div>
    </div>
    <div class="sec" id="studio-previews"></div>
  </div>
</div>
<script src="js-dos.js"></script>
<script>
// Saves live on the server (saves/<slot>), so a season follows you to any browser on the tailnet.
// A slot is just a different server key. js-dos saves on its sidebar Save button and, with autoSave, when the
// tab is hidden, fullscreen is left or the mouse is unlocked. This page adds a SAVES panel on top of that.
const DEFAULT_SLOT = 'tlrb2-main';
const SLOT_RE = /^[A-Za-z0-9_-]{1,64}$/;
const WRITE = { 'X-TLRB2': '1' };   // the server refuses writes without it (cross-site guard)
const PREFS_KEY = 'tlrb2.prefs';
const byId = (id) => document.getElementById(id);
const status = byId('status');

function validSlot(s) { return typeof s === 'string' && SLOT_RE.test(s) && s.toLowerCase() !== 'old'; }
function slotError(s) {
  return validSlot(s) ? '' : 'Use 1 to 64 letters, digits, dashes or underscores (not "old").';
}
function readPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; }
}
function writePrefs(patch) {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(Object.assign(readPrefs(), patch))); } catch (e) { /* private mode */ }
}
function initialSlot() {
  const m = /(?:^|[#&])slot=([^&]*)/.exec(location.hash);
  if (m) {
    try { const s = decodeURIComponent(m[1]); if (validSlot(s)) return s; } catch (e) { /* bad escape */ }
  }
  const p = readPrefs().slot;
  return validSlot(p) ? p : DEFAULT_SLOT;
}
function setStatus(m) { status.textContent = m; }
function setMsg(m) { byId('saves-msg').textContent = m; }
function setErr(m) { byId('saves-err').textContent = m; }
function slotUrl(name) { return 'saves/' + encodeURIComponent(name); }

let slot = initialSlot();
let dos = null;
let busy = false;
let lastSaved = null;      // ms, last successful save of the current slot this session
let listing = { slots: [], versions: {} };
let pendingSwitch = null;  // slot name blocked by a failed save, awaiting "Switch anyway"
let autoTimer = null;
let leaving = false;     // set once a slot switch starts reloading the page

function makeFs(name) {
  return {
    urlToKey: () => name,
    pull: async (key) => {
      const r = await fetch(slotUrl(key), { cache: 'no-store' });
      if (r.status === 404) {
        if (name === slot) setStatus('slot ' + name + ': no save yet (new league)');
        return null;
      }
      if (!r.ok) throw new Error('load failed: ' + r.status);
      if (name === slot) setStatus('slot ' + name + ': loaded');
      return new Uint8Array(await r.arrayBuffer());
    },
    push: async (key, data) => {
      if (leaving) return;
      const r = await fetch(slotUrl(key), { method: 'PUT', body: data, headers: WRITE });
      if (!r.ok) {
        if (name === slot) setStatus('slot ' + name + ': SAVE FAILED ' + r.status);
        throw new Error('save failed: ' + r.status);
      }
      if (name === slot) {
        lastSaved = Date.now();
        setStatus('slot ' + name + ': saved ' + new Date(lastSaved).toLocaleTimeString());
        renderHeader();
      }
    },
    delete: async (key) => { await fetch(slotUrl(key), { method: 'DELETE', headers: WRITE }); },
  };
}

let crcTable = null;
function crc32(data) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      crcTable[n] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) c = crcTable[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// A zip holding one stored (uncompressed) entry: local header, data, central directory, end record.
function storedZip(path, data) {
  const name = new TextEncoder().encode(path);
  const crc = crc32(data);
  const out = new Uint8Array(30 + name.length + data.length + 46 + name.length + 22);
  const v = new DataView(out.buffer);
  const entry = (at, central) => {
    let o = at;
    v.setUint32(o, central ? 0x02014b50 : 0x04034b50, true); o += 4;
    if (central) { v.setUint16(o, 20, true); o += 2; }
    v.setUint16(o, 20, true);                 // version needed
    v.setUint16(o + 2, 0, true);              // flags
    v.setUint16(o + 4, 0, true);              // method: stored
    v.setUint16(o + 6, 0, true);              // time
    v.setUint16(o + 8, 0x21, true);           // date 1980-01-01
    v.setUint32(o + 10, crc, true);
    v.setUint32(o + 14, data.length, true);
    v.setUint32(o + 18, data.length, true);
    v.setUint16(o + 22, name.length, true);
    o += 26;                                  // extra length 0 (and, central, comment, disk, attributes, offset 0)
    if (central) o += 14;
    out.set(name, o);
    return o + name.length;
  };
  let o = entry(0, false);
  out.set(data, o);
  o += data.length;
  const cd = o;
  o = entry(cd, true);
  v.setUint32(o, 0x06054b50, true);
  v.setUint16(o + 8, 1, true);
  v.setUint16(o + 10, 1, true);
  v.setUint32(o + 12, o - cd, true);
  v.setUint32(o + 16, cd, true);
  return out;
}

async function boot(name) {
  const old = byId('dos');
  const host = document.createElement('div');
  host.id = 'dos';
  old.replaceWith(host);
  const opts = {
    url: 'tlrb2.jsdos',
    pathPrefix: 'emulators/',
    backend: 'dosboxX',
    autoStart: true,
    autoSave: true,
    noCloud: true,
    fsChanges: makeFs(name),
  };
  // The portrait studio customs overlay the bundle's PORTRAIT.ANM. No file (404) or any error: boot as today.
  // js-dos writes plain initFs files before it unpacks the bundles (which would put the stock file back), but
  // unpacks zip entries in order after the bundle and the slot's changes, so the overlay goes in as a zip.
  try {
    const r = await fetch('studio/PORTRAIT.ANM', { cache: 'no-store' });
    if (r.status === 200) {
      opts.initFs = [storedZip('TONY2/ANMS/PORTRAIT.ANM', new Uint8Array(await r.arrayBuffer()))];
    }
  } catch (e) { /* boot without the overlay */ }
  return Dos(host, opts);
}

async function saveNow() {
  if (!dos) return false;
  let ok = false;
  try { ok = (await dos.save()) !== false; } catch (e) { ok = false; }
  setMsg(ok ? 'saved ' + new Date().toLocaleTimeString() : 'SAVE FAILED');
  if (ok && !leaving && !byId('saves-panel').hidden) refreshList();
  return ok;
}

async function switchTo(name, opts) {
  opts = opts || {};
  if (busy) return false;
  busy = true;
  try {
    if (dos && !opts.skipSave && !opts.force) {
      const ok = await saveNow();
      if (!ok) {
        pendingSwitch = name;
        renderPending();
        return false;
      }
    }
    pendingSwitch = null;
    renderPending();
    // js-dos 8.5.3 props.stop() never resolves, so a slot switch is a page reload with the slot in the hash.
    // leaving blocks pushes from here on, so autoSave on unload cannot overwrite a just-restored slot.
    leaving = true;
    writePrefs({ slot: name });
    location.hash = 'slot=' + encodeURIComponent(name);
    location.reload();
    return true;
  } catch (e) {
    setErr('switch failed: ' + e.message);
    return false;
  } finally {
    busy = false;
  }
}

function renderHeader() {
  byId('saves-slot').textContent = 'slot ' + slot;
  let t = lastSaved;
  if (!t && listing.slots) {
    const hit = listing.slots.find((s) => s.name === slot);
    if (hit) t = hit.mtime * 1000;
  }
  byId('saves-last').textContent = t ? 'last saved ' + new Date(t).toLocaleString() : 'not saved yet';
}

function renderPending() {
  const b = byId('saves-force');
  b.hidden = !pendingSwitch;
  if (pendingSwitch) {
    b.textContent = 'Switch anyway to ' + pendingSwitch;
    setErr('Save failed. Switching now drops unsaved progress in ' + slot + '.');
  }
}

async function fetchListing() {
  const r = await fetch('saves/', { cache: 'no-store' });
  if (!r.ok) throw new Error('list failed: ' + r.status);
  return r.json();
}

async function refreshList() {
  try {
    listing = await fetchListing();
    renderList();
    renderHeader();
  } catch (e) {
    setErr('could not load slot list');
  }
}

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function button(label, onClick) {
  const b = el('button', label);
  b.type = 'button';
  b.addEventListener('click', onClick);
  return b;
}

function fmtKB(size) { return (size / 1024).toFixed(1) + ' KB'; }
function fmtTime(mtime) { return new Date(mtime * 1000).toLocaleString(); }

function versionRows(name, versions) {
  const d = el('details');
  d.appendChild(el('summary', 'history (' + versions.length + ')', 'muted'));
  const ul = el('ul');
  for (const v of versions) {
    const li = el('li');
    li.appendChild(el('div', fmtTime(v.mtime) + '  ' + fmtKB(v.size) + '  ' + v.tag, 'muted'));
    li.appendChild(button('Restore', () => restoreVersion(name, v.id)));
    ul.appendChild(li);
  }
  d.appendChild(ul);
  return d;
}

function slotRow(name, slotInfo, versions, gone) {
  const li = el('li');
  const label = name + (name === slot ? ' (current)' : '');
  li.appendChild(el('div', label));
  let meta;
  if (slotInfo) meta = fmtKB(slotInfo.size) + ', ' + fmtTime(slotInfo.mtime);
  else if (gone) meta = 'deleted';
  else meta = 'not saved yet';
  li.appendChild(el('div', meta, 'muted'));

  const row = el('div');
  if (name !== slot && !gone) {
    row.appendChild(button('Load', () => { setErr(''); switchTo(name); }));
  }
  if (slotInfo && name !== slot) {
    const del = button('Delete', () => {
      del.hidden = true;
      const ok = button('Confirm delete', async () => {
        const r = await fetch(slotUrl(name), { method: 'DELETE', headers: WRITE });
        if (!r.ok) setErr('delete failed: ' + r.status);
        await refreshList();
      });
      const no = button('Cancel', () => { ok.remove(); no.remove(); del.hidden = false; });
      row.appendChild(ok);
      row.appendChild(no);
    });
    row.appendChild(del);
  }
  li.appendChild(row);
  if (versions && versions.length) li.appendChild(versionRows(name, versions));
  return li;
}

function renderList() {
  const ul = byId('saves-list');
  ul.textContent = '';
  const live = listing.slots || [];
  const versions = listing.versions || {};
  const liveNames = new Set(live.map((s) => s.name));
  for (const s of live) {
    ul.appendChild(slotRow(s.name, s, versions[s.name] || [], false));
  }
  if (!liveNames.has(slot) && !versions[slot]) {
    ul.insertBefore(slotRow(slot, null, [], false), ul.firstChild);
  }
  for (const n of Object.keys(versions)) {
    if (!liveNames.has(n)) ul.appendChild(slotRow(n, null, versions[n], true));
  }
  if (!ul.firstChild) ul.appendChild(el('li', 'no slots yet', 'muted'));
}

async function restoreVersion(name, id) {
  setErr('');
  const r = await fetch(slotUrl(name) + '?restore=' + encodeURIComponent(id), { method: 'POST', headers: WRITE });
  if (!r.ok) { setErr('restore failed: ' + r.status); return; }
  // The current slot is reloaded without saving first, so the restored copy is not overwritten.
  const ok = name === slot ? await switchTo(name, { skipSave: true }) : await switchTo(name);
  if (!ok && !pendingSwitch) setErr('could not reload ' + name + ', try again');
}

async function saveAs() {
  const name = byId('saves-as').value.trim();
  const bad = slotError(name);
  if (bad) { setErr(bad); return; }
  if (name === slot) { setErr('that is the current slot'); return; }
  setErr('');
  if (!(await saveNow())) { setErr('SAVE FAILED, nothing copied'); return; }
  const r = await fetch(slotUrl(name) + '?copy=' + encodeURIComponent(slot), { method: 'POST', headers: WRITE });
  if (!r.ok) { setErr('copy failed: ' + r.status); return; }
  await switchTo(name);
}

async function newLeague() {
  const name = byId('saves-league').value.trim();
  const bad = slotError(name);
  if (bad) { setErr(bad); return; }
  setErr('');
  try {
    listing = await fetchListing();
  } catch (e) {
    setErr('could not check slot names');
    return;
  }
  const taken = name === slot || (listing.slots || []).some((s) => s.name === name) ||
                Object.prototype.hasOwnProperty.call(listing.versions || {}, name);
  if (taken) { setErr(name + ' already exists'); return; }
  await switchTo(name);
}

function applyAutosave() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (!byId('saves-auto').checked) return;
  const mins = Number(byId('saves-every').value) || 5;
  autoTimer = setInterval(() => {
    if (document.hidden || busy || !dos) return;
    saveNow();
  }, mins * 60000);
}

function loadAutosavePrefs() {
  const p = readPrefs();
  const every = [2, 5, 10].includes(Number(p.every)) ? String(p.every) : '5';
  byId('saves-auto').checked = p.auto !== false;
  byId('saves-every').value = every;
}

// Portrait studio. A job is queued by POST, polled every 3 s while queued or running, and its four previews can be
// added as customs. Customs take effect after SAVE AND RELOAD, because boot() reads them.
const JOB_ID_RE = /^[0-9a-f]{16}$/;
const STUDIO_TYPES = ['image/png', 'image/jpeg'];
const STUDIO_MAX_PIC = 4 * 1024 * 1024;
const studio = { job: null, state: null, shown: null, timer: null };

function studioMsg(m) { byId('studio-status').textContent = m; }
function studioErr(m) { byId('studio-err').textContent = m; }
function studioStatus(j) {
  if (j.state === 'queued') return 'GPU busy: queued, position ' + j.position;
  if (j.state === 'running') return 'rendering';
  if (j.state === 'done') return 'done';
  return 'failed' + (j.error ? ': ' + j.error : '');
}

function readPicture(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).replace(/^data:[^,]*,/, ''));
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(file);
  });
}

function studioSchedule() {
  clearTimeout(studio.timer);
  studio.timer = null;
  if (!byId('studio-panel').hidden) studio.timer = setTimeout(studioPoll, 3000);
}

async function studioPoll() {
  clearTimeout(studio.timer);
  studio.timer = null;
  const id = studio.job;
  if (!id) return;
  let j;
  try {
    const r = await fetch('studio/jobs/' + id, { cache: 'no-store' });
    if (!r.ok) throw new Error('status ' + r.status);
    j = await r.json();
  } catch (e) {
    if (id === studio.job) { studioErr('status failed: ' + e.message); studioSchedule(); }
    return;
  }
  if (id !== studio.job) return;
  studio.state = j.state;
  studioMsg(studioStatus(j));
  if (j.state === 'done') showPreviews(j);
  if (j.state === 'queued' || j.state === 'running') studioSchedule();
}

function showPreviews(j) {
  if (studio.shown === j.id) return;
  studio.shown = j.id;
  const box = byId('studio-previews');
  box.textContent = '';
  for (let k = 0; k < j.variants; k++) box.appendChild(previewCell(j.id, k));
}

function previewCell(id, k) {
  const cell = el('div', null, 'studio-cell');
  const img = el('img');
  img.alt = 'variant ' + k;
  img.src = 'studio/jobs/' + id + '/v' + k + '.png';
  const note = el('div', null, 'muted');
  const again = button('SAVE AND RELOAD', () => switchTo(slot));
  again.hidden = true;
  const add = button('ADD TO GAME', async () => {
    add.disabled = true;
    try {
      const r = await fetch('studio/jobs/' + id + '/accept?pick=' + k, { method: 'POST', headers: WRITE });
      if (!r.ok) throw new Error('status ' + r.status);
      const j = await r.json();
      note.textContent = 'ADDED AS CUSTOM ' + j.custom + ': SAVE AND RELOAD, THEN PICK IT IN CREATE A PLAYER (FACE FIELD).';
      again.hidden = false;
    } catch (e) {
      add.disabled = false;
      note.textContent = 'add failed: ' + e.message;
    }
  });
  cell.append(img, add, note, again);
  return cell;
}

async function studioGenerate() {
  studioErr('');
  const prompt = byId('studio-prompt').value.trim();
  const file = byId('studio-file').files[0];
  if (!prompt && !file) { studioErr('describe a face or pick a picture'); return; }
  if (file && STUDIO_TYPES.indexOf(file.type) < 0) { studioErr('the picture must be PNG or JPEG'); return; }
  if (file && file.size > STUDIO_MAX_PIC) { studioErr('the picture is over 4 MB'); return; }
  const go = byId('studio-go');
  go.disabled = true;
  try {
    const body = { prompt };
    if (file) body.image = await readPicture(file);
    const r = await fetch('studio/jobs', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, WRITE),
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      studioErr(r.status === 429 ? 'the GPU queue is full, try again later'
        : r.status === 400 ? 'refused: plain ASCII up to 300 characters, and a PNG or JPEG picture'
        : 'could not start: ' + r.status);
      return;
    }
    const { id } = await r.json();
    if (!JOB_ID_RE.test(id)) throw new Error('bad job id');
    studio.job = id;
    studio.state = 'queued';
    studio.shown = null;
    byId('studio-previews').textContent = '';
    studioMsg('queued');
    studioPoll();
  } catch (e) {
    studioErr('could not start: ' + e.message);
  } finally {
    go.disabled = false;
  }
}

byId('studio-toggle').addEventListener('click', () => {
  const panel = byId('studio-panel');
  panel.hidden = !panel.hidden;
  if (panel.hidden) {
    clearTimeout(studio.timer);
    studio.timer = null;
  } else if (studio.state === 'queued' || studio.state === 'running') {
    studioPoll();
  }
});
byId('studio-go').addEventListener('click', () => studioGenerate());

// Wire the panel.
byId('saves-toggle').addEventListener('click', () => {
  const panel = byId('saves-panel');
  panel.hidden = !panel.hidden;
  writePrefs({ open: !panel.hidden });
  if (!panel.hidden) refreshList();
});
byId('saves-now').addEventListener('click', () => saveNow());
byId('saves-as-go').addEventListener('click', () => saveAs());
byId('saves-league-go').addEventListener('click', () => newLeague());
byId('saves-force').addEventListener('click', () => {
  const name = pendingSwitch;
  if (name) switchTo(name, { force: true });
});
byId('saves-auto').addEventListener('change', () => {
  writePrefs({ auto: byId('saves-auto').checked });
  applyAutosave();
});
byId('saves-every').addEventListener('change', () => {
  writePrefs({ every: Number(byId('saves-every').value) });
  applyAutosave();
});

// First boot.
setStatus('slot ' + slot + ': loading');
boot(slot).then((d) => { dos = window.tlrb2 = d; }, (e) => setStatus('boot failed: ' + e.message));
writePrefs({ slot: slot });
loadAutosavePrefs();
applyAutosave();
byId('saves-panel').hidden = readPrefs().open !== true;
renderHeader();
refreshList();
</script>
</body>
</html>

# dosbox-staging config for Tony La Russa Baseball II (v1.3 CD)
# C: = install root (set by launcher via -c), D: = CD image
[sdl]
fullscreen = false
output = texture
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = auto
cputype = auto
cycles = 20000
[sblaster]
sbtype = sb16
[mixer]
nosound = false
[dos]
xms = true
ems = true
umb = true
[mouse]
mouse_capture = seamless

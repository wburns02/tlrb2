# DOSBox-X config for TLRB2 instrumentation runs (file I/O + INT 21h logging). Same machine as tlrb2.conf.
[sdl]
output = surface
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = normal
cycles = 20000
[sblaster]
sbtype = sb16
[dos]
xms = true
ems = true
umb = true
[log]
logfile = /mnt/nvme/tlrb2/logs/dosbox-x.log
fileio = true
int21 = false
files = debug
dosmisc = debug
[mouse]
autolock = false
